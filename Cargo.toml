[package]
name = "hesewake-notch"
version = "0.11.1"
edition = "2021"
build = "build.rs"

[dependencies]
tiny-skia = "0.11"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "ico"] }
windows-core = "0.58"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lirik Jepang -> romaji. Kamus IPADIC berupa berkas terpisah (dict\ipadic), versi harus sama dengan crate.
lindera = { version = "=6.2.0", default-features = false, features = ["mmap"] }
wana_kana = { version = "5", default-features = false }
# Ekstrak arsip kamus yang diunduh dari Settings (sudah ada di dependency tree lewat `image`/png).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dependencies.windows]
version = "0.58"
features = [
  "Foundation",
  "Win32_Networking_WinInet",
  "Win32_NetworkManagement_Ndis",
  "Win32_NetworkManagement_IpHelper",
  "Win32_UI_Shell_PropertiesSystem",
  "implement",
  "Win32_Media",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_Multimedia",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_IO",
  "Win32_Storage_FileSystem",
  "Win32_System_ProcessStatus",
  "ApplicationModel",
  "UI_Notifications_Management",
  "UI_Notifications",
  "Foundation_Collections",
  "Devices_Enumeration",
  "Devices_Bluetooth",
  "Win32_System_Registry",
  "Win32_System_Power",
  "Networking_Connectivity",
  "Media_Control",
  "Storage_Streams",
  "Web_Http",
  "Web_Http_Headers",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_Credentials",
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_System_Time",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true